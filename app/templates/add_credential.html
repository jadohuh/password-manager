{% extends "base.html" %}

{% block content %}
<div class="form-container">
    <h2>Add New Password</h2>
    <form method="POST">
        <label>Site Name</label>
        <input type="text" name="site_name" placeholder="e.g. Gmail, Netflix" required>

        <label>Username / Email</label>
        <input type="text" name="site_username" placeholder="e.g. john@email.com" required>

        <div class="password-field">
            <label>Password</label>
            <div class="password-input-wrap">
                <input type="password" name="site_password" required>
                <button type="button" class="toggle-password">Show</button>
            </div>
        </div>

        <div class="password-field">
            <label>Account Password (required to encrypt)</label>
            <div class="password-input-wrap">
                <input type="password" name="master_password" required>
                <button type="button" class="toggle-password">Show</button>
            </div>
        </div>

        <button type="submit">Save Password</button>
    </form>
    <p><a href="{{ url_for('views.dashboard') }}">Back to Dashboard</a></p>
</div>
{% endblock %}
